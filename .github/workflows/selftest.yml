# Runs scripts/selftest.py on macOS, Windows and Linux for every push and pull
# request. It uses a fake Claude and a fake ranker, so it needs no secrets,
# spends no Claude usage and does not install Ollama.
name: selftest
on: [push, pull_request]
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/selftest.py
        env:
          NO_NOTIFY: "1"
